<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./bar.css">
<link rel="stylesheet" href="./dash.css">
</head>
<body data-mode="dash">
<!-- a zine spread, stapled down the middle: on the left page the issue's picture photocopied large with its title cut
     out over it; on the right the time, the month, the dots, what is on the stereo, and a line written in by hand -->
<main id="dash">
  <section id="art">
    <div class="port"><img id="artImg" alt=""><i class="screen"></i><i class="over"></i></div>
    <div class="cap"><span class="k" id="artK"></span><span id="artCut"></span><span id="artEn"></span></div>
    <button class="follow" id="wallBtn" title="Wallpaper · paste another cover up">NEW COVER</button>
  </section>
  <i class="staple s1"></i><i class="staple s2"></i>
  <section id="side">
    <header class="rise">
      <div class="run"><span class="lbl">the time is</span><div class="big" id="hm">--:--</div></div>
      <div class="date"><span id="jdate"></span><span id="edate"></span></div>
    </header>
    <div class="row rise"><div id="cal"></div><div id="rings"></div></div>
    <div id="media" class="rise idle">
      <i class="tape"></i>
      <div class="credit"><span class="role">ON THE STEREO</span><b id="mt">NOTHING ON</b><span id="ma"></span><div class="rule"><i id="mprog"></i></div></div>
      <div class="ctl"><button class="follow" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h3v14H6zM20 5 10 12l10 7z"/></svg></button><button class="follow" id="pp" title="Play / pause"><svg viewBox="0 0 24 24"><path id="ppi" d="M7 5l12 7-12 7z"/></svg></button><button class="follow" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M15 5h3v14h-3zM4 5l10 7-10 7z"/></svg></button></div>
    </div>
    <footer class="rise"><span class="saying"><i id="precept"></i></span><span class="mark">photocopied · pass it on</span></footer>
  </section>
</main>

<!-- power: four stickers slapped on the back page. Armed, one is half peeled, and the copier lamp crawls across the strip
     under the heading over the 3 s it waits -->
<section id="power">
  <div id="pmid"><span id="pcut"></span><b class="k" id="pk">LAST PAGE</b><span id="pl"></span><i id="ph"></i></div>
  <i class="fuse"></i>
  <div class="brands">
    <button class="pb" data-a="lock"></button><button class="pb" data-a="sleep"></button>
    <button class="pb danger" data-a="restart"></button><button class="pb danger" data-a="off"></button>
  </div>
</section>

<section id="wall"><header><span id="wcut"></span><span>paste a cover up</span><i id="wmsg"></i></header><div class="cards"></div></section>
<section id="keysheet"><header><span id="kcut"></span><span>what every key does</span><i>Esc to close</i></header><div class="cols"></div></section>

<script type="module" src="./dash.js"></script>
</body>
</html>
