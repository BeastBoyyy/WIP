<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./bar.css">
</head>
<body>
<!-- strips of photocopy taped along the top of the screen, toner all over them. On the left the five issues, the one
     open cut in on cyan; in the middle what is on, its name on a label-maker strip; on the right the dots, the time and
     the sticker that turns it all off -->
<div id="bar">
  <div class="island" id="iLeft">
    <i class="tape t1"></i>
    <button class="it follow" id="overview" title="Overview · Ctrl+Alt+Space">
      <svg width="20" height="18" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 13h7v7H3z"/><path d="M14 13h7v7h-7z" fill="currentColor"/></svg>
    </button>
    <i class="slash"></i>
    <div id="ws" title="wheel: next / previous · right-click: send the focused window here"></div>
    <i class="slash"></i>
    <button class="it follow lk" id="lFlow" title="Search · apps, files, web · Alt+Space">find</button>
    <button class="it follow lk" id="lFiles" title="Files · File Explorer">files</button>
    <button class="it follow lk" id="lTerm" title="Terminal">shell</button>
    <button class="it follow lk" id="lKeys" title="Keys and bar actions">keys</button>
  </div>

  <div class="island" id="iCenter">
    <i class="tape t2"></i>
    <div class="it" id="title" title="wheel: focus ← → · double-click: maximize · right-click: float · middle-click: close"><span class="k" id="tk">BLANK PAGE</span><b id="tapp">xerox</b><span id="tname"></span></div>
  </div>

  <div class="island" id="iRight">
    <i class="tape t3"></i>
    <div id="tray" hidden></div>
    <button class="it follow" id="trayBtn" title="System tray"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="it follow cell" id="weather"><span class="k" id="wk">sunny</span><span class="num" id="wt">–°</span></div>
    <button class="it follow np" id="media" hidden title="click: play / pause · right-click: next · middle-click: previous">
      <svg class="rec" viewBox="0 0 20 20"><circle class="v" cx="10" cy="10" r="9"/><circle class="g" cx="10" cy="10" r="6"/><circle class="g" cx="10" cy="10" r="3.6"/><circle class="h" cx="10" cy="10" r="1.6"/></svg>
      <span id="mt"></span>
    </button>
    <i class="slash"></i>
    <div class="it follow" id="rings"><svg class="ring" viewBox="0 0 20 20" id="rcpu"></svg><svg class="ring" viewBox="0 0 20 20" id="rram"></svg></div>
    <div class="it follow cell" id="batt" hidden><span class="k">batt</span><span class="bar"><i class="sb"><i id="bfill"></i></i><span class="num" id="bp">–</span></span></div>
    <button class="it follow" id="net">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><path d="M10.5 18h3v3h-3z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="it follow" id="volb" title="wheel: volume · click: mute · right-click: sound settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="wv" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="mx" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg><span class="num" id="vol"></span>
    </button>
    <i class="slash"></i>
    <button class="it follow cell" id="clock"><span class="k" id="day">mon 1 jan</span><span class="hm" id="hm">--:--</span></button>
    <button class="it follow" id="pwr" title="Power · pull the plug"><span class="stk">OFF</span></button>
  </div>
</div>
<script type="module" src="./bar.js"></script>
</body>
</html>
