<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./desk.css">
</head>
<body>
<!-- on the wallpaper, under every window: a photocopied flyer stapled to the wall. The day cut out of magazines, the time
     on a cyan scrap, the issue and the weather typed, and tear-off tabs along the bottom (one already taken) -->
<main id="desk">
  <div id="flyer">
    <div class="sheet">
    <i class="stp a"></i><i class="stp b"></i>
    <div class="top"><span class="lbl">TODAY</span><span id="dday"></span></div>
    <div class="scrap"><span id="dtime">--:--</span></div>
    <div class="typed"><span id="dno"></span><span id="dwx"></span></div>
    </div>
    <div class="tabs"><i>pass it on</i><i>pass it on</i><i class="gone"></i><i>pass it on</i><i>pass it on</i><i>pass it on</i></div>
  </div>
</main>
<script type="module" src="./desk.js"></script>
</body>
</html>
