<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inferno desk</title>
<meta name="description" content="The Inferno theme's desk: black shapes cut out against the fire.">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./desk.css">
</head>
<body>
<!-- on the wallpaper, under every window: the hour in blackletter, burning (fire moves slowly up through the letters),
     a black shadow under it so it reads on any painting. Under it the river you are in, the day and the weather -->
<main id="desk">
  <div id="dhm">--:--</div>
  <div class="river"><b id="driver"></b><span id="dof"></span></div>
  <div class="row"><span id="dday"></span><span id="dwx"></span></div>
</main>
<script type="module" src="./desk.js"></script>
</body>
</html>
