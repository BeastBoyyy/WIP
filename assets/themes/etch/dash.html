<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./bar.css">
<link rel="stylesheet" href="./dash.css">
</head>
<body data-mode="dash">
<!-- a print pulled from the open plate: on the left the picture in its plate mark, its title and number under it, and
     the four dials engraved below; on the right the hour, the month, the organ, and the motto over the signature -->
<main id="dash">
  <section id="art">
    <div class="port"><img id="artImg" alt=""><i class="lux"></i></div>
    <div class="cap"><span class="k" id="artK"></span><i class="fl"></i><span id="artEn"></span></div>
    <p id="legend"></p>
    <button class="follow" id="wallBtn" title="Wallpaper · print another plate">another plate</button>
    <div id="rings"></div>
  </section>
  <section id="side">
    <header>
      <span class="lbl">the hour</span>
      <div class="big" id="hm">--:--</div>
      <div class="date"><span id="jdate"></span><span id="edate"></span></div>
    </header>
    <div id="cal"></div>
    <div id="media" class="idle">
      <svg class="pipe" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M4 17V8M8 17V4M12 17V6M16 17V9"/><path d="M2 17.5h16"/><path d="M3 8h2M7 4h2M11 6h2M15 9h2" stroke-width="1.5"/></svg>
      <div class="credit"><span class="role">the organ</span><b id="mt">Silence</b><span id="ma"></span><div class="rule"><i id="mprog"></i></div></div>
      <div class="ctl"><button class="follow" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5 10 12l10 7z"/></svg></button><button class="follow" id="pp" title="Play / pause"><svg viewBox="0 0 24 24"><path id="ppi" d="M7 5l12 7-12 7z"/></svg></button><button class="follow" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l10 7-10 7z"/></svg></button></div>
    </div>
    <footer><span class="saying" id="precept"></span><span class="sig"><i>R. S. sculp.</i></span></footer>
  </section>
</main>

<!-- power: four medallions struck in the plate. Armed, its light burns, and the candle under the heading burns down
     over the 3 s it waits -->
<section id="power">
  <div id="pmid"><b class="k" id="pk">EXPLICIT</b><span id="pl"></span><i id="ph"></i></div>
  <i class="fuse"><i class="lux"></i></i>
  <div class="brands">
    <button class="pb" data-a="lock"><svg viewBox="0 0 40 40"><circle cx="20" cy="16" r="5"/><path d="M17 20l-2 11h10l-2-11"/></svg><span class="k">SEALED</span></button>
    <button class="pb" data-a="sleep"><svg viewBox="0 0 40 40"><path d="M25 8a12 12 0 1 0 7 21 10 10 0 0 1-7-21z"/></svg><span class="k">NOCTURNE</span></button>
    <button class="pb danger" data-a="restart"><svg viewBox="0 0 40 40"><path d="M30 20a10 10 0 1 1-3-7.1"/><path d="M28 7v6h-6"/></svg><span class="k">REPRISE</span></button>
    <button class="pb danger" data-a="off"><svg viewBox="0 0 40 40"><path d="M16 33V17h8v16z"/><path d="M20 17v-3"/><path d="M20 12c-2-2 1-4 0-6M23 11c1-2-1-3 1-5"/></svg><span class="k">FINIS</span></button>
  </div>
</section>

<section id="wall"><header><b class="k">EX OFFICINA</b><span>pull a print for the wall</span><i id="wmsg"></i></header><div class="cards"></div></section>
<section id="keysheet"><header><b class="k">INSTRUCTIO</b><span>what every key does</span><i>Esc to close</i></header><div class="cols"></div></section>

<script type="module" src="./dash.js"></script>
</body>
</html>
