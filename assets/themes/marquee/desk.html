<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./desk.css">
</head>
<body>
<!-- on the wallpaper, under every window: the cinema's showtime board. A red crown ringed with bulbs, and on the black
     tracks below it the day, the act on tonight, the showtime and the weather, set in loose plastic letters -->
<main id="desk">
  <div id="board">
    <div class="crown"><span>NOW SHOWING</span></div>
    <div class="tracks">
      <div class="track" id="dact"></div>
      <div class="track big"><span class="pre">SHOWTIME</span><span id="dtime"></span></div>
      <div class="track" id="dday"></div>
      <div class="track small" id="dwx"></div>
    </div>
  </div>
</main>
<script type="module" src="./desk.js"></script>
</body>
</html>
