<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relic bar</title>
<meta name="description" content="The Relic theme's bar: a vanitas shelf lit by one candle that burns down with the day.">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./bar.css">
</head>
<body>
<!-- Relic: a vanitas shelf in a dark room, lit by one candle at its left end. The candle burns down with the day: its
     wax is the part of the day still left. Everything on the shelf sits in shadow until you point at it, when it is
     brought into the candlelight. The five workspaces are the objects on the shelf (Skull, Crown, Key, Book, Butterfly),
     written out in italic; the one you are in stands in the light -->
<div id="bar">
  <i class="glow" aria-hidden="true"></i>
  <div class="island" id="iLeft">
    <button class="it" id="clock"><i class="candle" aria-hidden="true"><i class="wax"></i><i class="flw"><i class="fl"></i></i></i><span id="hm">--:--</span><span id="day"></span></button>
    <i class="loz" aria-hidden="true"></i>
    <div id="ws" title="Wheel: next or previous; right-click: send the window here"></div>
    <button class="it" id="overview" title="Overview (Ctrl+Alt+Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/><path class="sand" d="M9.5 19.5h5l-2.5-2.2z"/></svg></button>
  </div>

  <div class="island" id="iCenter">
    <div class="it" id="title" title="Wheel: focus left or right; double-click: maximize; right-click: float; middle-click: close"><span id="tk">On the shelf</span><b id="tapp">Nothing open</b><span id="tname"></span></div>
  </div>

  <div class="island" id="iRight">
    <button class="it lk" id="lFlow" title="Search apps, files and the web (Alt+Space)">Search</button>
    <button class="it lk" id="lFiles" title="File Explorer">Files</button>
    <button class="it lk" id="lTerm" title="Terminal">Terminal</button>
    <button class="it lk" id="lKeys" title="Every shortcut">Keys</button>
    <i class="loz" aria-hidden="true"></i>
    <div id="tray" hidden></div>
    <button class="it" id="trayBtn" title="Tray icons"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5"/></svg></button>
    <div class="it" id="weather"><span id="wk">Clear</span><span class="num" id="wt">-°</span></div>
    <button class="it" id="media" hidden title="Click: play or pause; right-click: next; middle-click: previous"><i class="smoke" aria-hidden="true"><i></i><i></i><i></i></i><span id="mt"></span></button>
    <div class="it" id="rings"><span class="lb">cpu</span><span class="num" id="rcpu">-</span><span class="lb">mem</span><span class="num" id="rram">-</span></div>
    <div class="it" id="batt" hidden><i class="cell"><i id="bfill"></i></i><span class="num" id="bp">-</span></div>
    <button class="it" id="net" title="Wi-Fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9.2a14 14 0 0 1 19 0M5.8 12.6a9.2 9.2 0 0 1 12.4 0M9.1 16a4.5 4.5 0 0 1 5.8 0"/><circle cx="12" cy="19.2" r="1.4"/></svg></button>
    <button class="it" id="volb" title="Wheel: volume; click: mute; right-click: sound settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sp" d="M3.5 9h3.8L12 5v14l-4.7-4H3.5z"/><path class="wv" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.4a8 8 0 0 1 0 11.2"/><path class="mx" d="M16 9.5l5 5M21 9.5l-5 5"/></svg><span class="num" id="vol"></span></button>
    <button class="it" id="pwr" title="Lock, sleep, restart or shut down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v8"/><path d="M6.6 7a7.5 7.5 0 1 0 10.8 0"/></svg></button>
  </div>
</div>
<script type="module" src="./bar.js"></script>
</body>
</html>
