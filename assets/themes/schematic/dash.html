<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./bar.css">
<link rel="stylesheet" href="./dash.css">
</head>
<body data-mode="dash">
<!-- a sheet out of the plan chest, opened along its creases: the open sheet's drawing in a viewport, the hour on a
     protractor, the month as a schedule, four scale rules, the plotter, and a general note -->
<main id="dash">
  <i class="crease v"></i><i class="crease h"></i>
  <section id="art">
    <div class="port"><img id="artImg" alt=""><i class="frame"></i></div>
    <div class="cap"><span class="k" id="artK"></span><span id="artEn"></span></div>
    <button class="follow" id="wallBtn" title="Wallpaper · plot a different sheet">REPLOT</button>
  </section>
  <section id="side">
    <header class="plate rise">
      <div class="dial"><svg id="prot" viewBox="0 0 300 150"></svg><div class="big" id="hm">--:--</div></div>
      <div class="date"><span id="jdate"></span><span id="edate"></span></div>
    </header>
    <div class="row rise"><div id="cal" class="plate"></div><div id="rings" class="plate"></div></div>
    <div id="media" class="plate rise idle">
      <svg class="pen" viewBox="0 0 26 18"><path class="paper" d="M1 16.5h24"/><path class="trace" pathLength="100" d="M2 11c2.5-6 4.5-6 7 0s4.5 6 7 0 4.5-6 7 0"/><g class="nib"><path d="M23 11l2.6-7.5 1.2.4L24.2 11.4z"/><circle cx="23" cy="11" r="1"/></g></svg>
      <div class="mtext"><b id="mt">PLOTTER IDLE</b><span id="ma"></span><div class="rule"><i id="mprog"></i></div></div>
      <div class="ctl"><button class="follow" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M7 5v14M19 5 9 12l10 7z"/></svg></button><button class="follow" id="pp" title="Play / pause"><svg viewBox="0 0 24 24"><path id="ppi" d="M7 5l12 7-12 7z"/></svg></button><button class="follow" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M17 5v14M5 5l10 7-10 7z"/></svg></button></div>
    </div>
    <footer class="rise"><span class="saying"><b class="k">NOTE</b><i id="precept"></i></span><span class="mark">RICE STUDIO · DRAWING OFFICE</span></footer>
  </section>
</main>

<!-- power: the revision stamps. Four on the sheet; armed, the dimension line under them shortens to nothing in 3 s -->
<section id="power">
  <div id="pmid"><b class="k" id="pk">REVISION</b><span id="pl"></span><i id="ph"></i></div>
  <i class="fuse"></i>
  <div class="brands">
    <button class="pb" data-a="lock"></button><button class="pb" data-a="sleep"></button>
    <button class="pb danger" data-a="restart"></button><button class="pb danger" data-a="off"></button>
  </div>
</section>

<section id="wall"><header><b class="k">SHEETS</b><span>Plot a sheet onto the wall</span><i id="wmsg"></i></header><div class="cards"></div></section>
<section id="keysheet"><header><b class="k">LEGEND</b><span>What every key does</span><i>Esc to close</i></header><div class="cols"></div></section>

<script type="module" src="./dash.js"></script>
</body>
</html>
